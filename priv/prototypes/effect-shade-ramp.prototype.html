<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROTOTYPE — Effect shade ramp</title>
<!--
  THROWAWAY PROTOTYPE — not production code, not on main.
  Question (issue #11): what are the actual colour tokens for the fixed ±3× Effect
  ramp, as one system shared by two surfaces (chart segments + Activity card tints)?

  Three variants of the Effect treatment, switchable via ?variant= and the floating
  bottom bar. Two orthogonal switches: the hue pair (?palette=) and a CVD simulation
  (?cvd=), because the hue pair IS the question and it can only be judged simulated.

  Sub-shape B (standalone page) deliberately: the weekly distribution chart has no
  page yet, and `activities.effect` does not exist in the schema, so there is no real
  LiveView data to mount variants against. The dashboard chrome below is copied from
  dashboard_live.html.heex so the variants are judged in context, not in a vacuum.
  Data is fabricated. Double-click the file to run it.
-->
<style>
:root {
  --page-from:#faf5ff; --page-via:#fdf2f8; --page-to:#fff7ed;   /* purple-50 / pink-50 / orange-50 */
  --card:#ffffff;
  --ink:#101828; --ink-2:#4a5565; --ink-3:#6a7282;              /* gray-900 / 600 / 500 */
  --hairline:#e5e7eb; --baseline:#d1d5dc;
  --purple-600:#9810fa; --purple-200:#e9d4ff; --pink-300:#fda5d5;
  --purple-50:#faf5ff; --pink-50:#fdf2f8;
  --neutral-tint:#f8fafc;
}
/* ---- the three candidate ramps. 4 steps/side, fixed, anchored at |3x|. ---- */
body[data-palette="teal-orange"] {
  --e1:#00bba7; --e2:#009689; --e3:#00786f; --e4:#005f5a;   /* teal 500/600/700/800 */
  --d1:#ff8904; --d2:#f54900; --d3:#ca3500; --d4:#9f2d00;   /* orange 400/600/700/800 */
  --e-tint:#f0fdfa; --e-tint-2:#cbfbf1; --d-tint:#fff7ed; --d-tint-2:#ffedd4;
}
body[data-palette="emerald-rose"] {
  --e1:#00bc7d; --e2:#009966; --e3:#007a55; --e4:#006045;   /* emerald 500/600/700/800 */
  --d1:#ff637e; --d2:#ff2056; --d3:#c70036; --d4:#a50036;   /* rose 400/500/700/800 */
  --e-tint:#ecfdf5; --e-tint-2:#d0fae5; --d-tint:#fff1f2; --d-tint-2:#ffe4e6;
}
body[data-palette="teal-red"] {
  --e1:#00bba7; --e2:#009689; --e3:#00786f; --e4:#005f5a;   /* teal 500/600/700/800 */
  --d1:#ff6467; --d2:#fb2c36; --d3:#c10007; --d4:#9f0712;   /* red 400/500/700/800 */
  --e-tint:#f0fdfa; --e-tint-2:#cbfbf1; --d-tint:#fef2f2; --d-tint-2:#ffe2e2;
}
* { box-sizing:border-box; }
body {
  margin:0; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; color:var(--ink);
  background:linear-gradient(135deg,var(--page-from),var(--page-via),var(--page-to));
  min-height:100vh; padding:2rem 1rem 7rem;
}
body[data-cvd="deutan"] #stage { filter:url(#deutan); }
body[data-cvd="protan"] #stage { filter:url(#protan); }
body[data-cvd="tritan"] #stage { filter:url(#tritan); }
body[data-cvd="mono"]   #stage { filter:grayscale(1); }
.wrap { max-width:56rem; margin:0 auto; display:flex; flex-direction:column; gap:2rem; }
.card { background:var(--card); border-radius:1.5rem; padding:1.5rem 1.75rem; box-shadow:0 10px 30px rgba(16,24,40,.06); }
.card.activities { border:2px solid var(--pink-300); }
h2 { font-size:.95rem; margin:0 0 .3rem; }
.sub { color:var(--ink-3); font-size:.78rem; margin:0 0 1.25rem; }
.hero { background:linear-gradient(135deg,#9810fa,#7e22ce,#3730a3); color:#fff; border-radius:1.5rem; padding:1.5rem 1.75rem; }
.hero .fig { font-size:2.5rem; font-weight:800; letter-spacing:-.02em; }
.hero .lbl { color:#e9d4ff; font-size:.78rem; text-transform:uppercase; letter-spacing:.08em; }

/* ---------- shared chart chrome ---------- */
.legend { display:flex; flex-wrap:wrap; gap:.35rem 1rem; margin:0 0 1rem; font-size:.72rem; color:var(--ink-2); }
.legend .item { display:flex; align-items:center; gap:.4rem; }
.swatch { width:12px; height:12px; border-radius:3px; box-shadow:inset 0 0 0 1px rgba(16,24,40,.10); flex:none; }
.axis-lbl { font-size:.68rem; color:var(--ink-3); font-variant-numeric:tabular-nums; }
.daylbl { font-size:.72rem; color:var(--ink-2); width:2.4rem; flex:none; font-variant-numeric:tabular-nums; }
.total { font-size:.72rem; color:var(--ink-2); font-variant-numeric:tabular-nums; width:4.5rem; text-align:right; flex:none; }
.total.neg { color:var(--ink); font-weight:700; }

/* ---------- variant A: stacked row + card wash ---------- */
.stack-row { display:flex; align-items:center; gap:.6rem; margin-bottom:.45rem; }
.stack { flex:1; display:flex; gap:2px; height:22px; align-items:stretch; }
.seg { border-radius:2px; }
.seg.first { border-top-left-radius:4px; border-bottom-left-radius:4px; }
.seg.last  { border-top-right-radius:4px; border-bottom-right-radius:4px; }
.act-wash { display:flex; gap:1rem; align-items:center; padding:1rem; border-radius:.75rem; margin-bottom:.6rem; border:1px solid; }
.act-name { font-weight:700; font-size:1.05rem; }
.act-meta { font-size:.78rem; color:var(--ink-2); margin-top:.15rem; }
.mult { font-weight:700; font-variant-numeric:tabular-nums; }
.pm { font-weight:700; font-variant-numeric:tabular-nums; text-align:right; font-size:1.05rem; }

/* ---------- variant B: diverging columns + left rail ---------- */
.dcol { flex:1; display:flex; flex-direction:column; align-items:stretch; }
.dtop { display:flex; flex-direction:column; justify-content:flex-end; gap:2px; }
.dbot { display:flex; flex-direction:column; justify-content:flex-start; gap:2px; }
.dseg { border-radius:2px; }
.dcol .cap { text-align:center; font-size:.68rem; color:var(--ink-3); padding-top:.3rem; }
.rail { display:flex; gap:1rem; align-items:center; padding:.9rem 1rem; border-radius:.75rem; margin-bottom:.6rem;
        background:var(--neutral-tint); border:1px solid var(--hairline); border-left-width:5px; border-left-style:solid; }
.chip { display:inline-flex; align-items:center; gap:.25rem; padding:.1rem .45rem; border-radius:.4rem; font-size:.72rem;
        font-weight:800; font-variant-numeric:tabular-nums; color:#fff; }
.chip.ghost { background:transparent; box-shadow:inset 0 0 0 1.5px currentColor; }

/* ---------- variant C: small multiples + chip only ---------- */
.sm-row { display:flex; align-items:center; gap:.6rem; margin-bottom:.5rem; }
.sm-name { width:9.5rem; flex:none; font-size:.78rem; color:var(--ink-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.sm-track { flex:1; display:flex; gap:3px; height:18px; }
.sm-cell { flex:1; border-radius:3px; background:var(--hairline); position:relative; }
.sm-fill { position:absolute; inset:0; border-radius:3px; }
.act-plain { display:flex; gap:1rem; align-items:center; padding:1rem; border-radius:.75rem; margin-bottom:.6rem;
             background:linear-gradient(90deg,var(--purple-50),var(--pink-50)); border:1px solid var(--purple-200); }

/* ---------- token table ---------- */
table { border-collapse:collapse; width:100%; font-size:.74rem; }
th, td { text-align:left; padding:.35rem .5rem; border-bottom:1px solid var(--hairline); }
th { color:var(--ink-3); font-weight:600; text-transform:uppercase; letter-spacing:.05em; font-size:.66rem; }
td.mono { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:.72rem; }

/* ---------- switcher ---------- */
#bar { position:fixed; left:50%; bottom:1rem; transform:translateX(-50%); z-index:50;
  display:flex; align-items:center; gap:.5rem; background:#0b0b0b; color:#fff; padding:.5rem .6rem;
  border-radius:999px; box-shadow:0 12px 32px rgba(0,0,0,.35); font-size:.78rem; }
#bar button { background:#242424; color:#fff; border:0; border-radius:999px; padding:.35rem .6rem; cursor:pointer; font-size:.78rem; }
#bar button:hover { background:#3a3a3a; }
#bar .name { min-width:13rem; text-align:center; font-weight:600; }
#bar select { background:#242424; color:#fff; border:0; border-radius:999px; padding:.35rem .5rem; font-size:.75rem; }
#bar .sep { width:1px; height:20px; background:#3a3a3a; }
.note { font-size:.74rem; color:var(--ink-2); background:#fffbeb; border:1px solid #fde68a; border-radius:.6rem; padding:.7rem .85rem; line-height:1.5; }
</style>
</head>
<body data-palette="teal-orange" data-cvd="none">

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="deutan"><feColorMatrix type="matrix" values="0.625 0.375 0 0 0  0.7 0.3 0 0 0  0 0.3 0.7 0 0  0 0 0 1 0"/></filter>
  <filter id="protan"><feColorMatrix type="matrix" values="0.567 0.433 0 0 0  0.558 0.442 0 0 0  0 0.242 0.758 0 0  0 0 0 1 0"/></filter>
  <filter id="tritan"><feColorMatrix type="matrix" values="0.95 0.05 0 0 0  0 0.433 0.567 0 0  0 0.475 0.525 0 0  0 0 0 1 0"/></filter>
</svg>

<div class="wrap" id="stage">
  <div class="hero">
    <div class="lbl">Today's Playtime</div>
    <div class="fig">1h 12m</div>
    <div style="color:#e9d4ff;font-size:.78rem;margin-top:.35rem">Reserve 3h 40m · This week 6h 05m</div>
  </div>

  <div class="card">
    <h2 id="chartTitle">This week's Play Minutes by Activity</h2>
    <p class="sub" id="chartSub"></p>
    <div class="legend" id="legend"></div>
    <div id="chart"></div>
  </div>

  <div class="card activities">
    <h2>Activities</h2>
    <p class="sub" id="cardSub"></p>
    <div id="cards"></div>
  </div>

  <div class="card">
    <h2>Tokens on screen — Tailwind v4</h2>
    <p class="sub">The fixed ramp, anchored at |3×| and clamped. This table is the deliverable; the variants above are how you judge it.</p>
    <div id="tokens"></div>
    <div style="height:1rem"></div>
    <div class="note" id="verdict"></div>
  </div>
</div>

<div id="bar">
  <button id="prev" title="previous variant">←</button>
  <span class="name" id="vname"></span>
  <button id="next" title="next variant">→</button>
  <span class="sep"></span>
  <label style="opacity:.7">hue</label>
  <select id="pal">
    <option value="teal-orange">teal ↔ orange (validated)</option>
    <option value="emerald-rose">emerald ↔ rose (intuitive)</option>
    <option value="teal-red">teal ↔ red</option>
  </select>
  <label style="opacity:.7">vision</label>
  <select id="cvd">
    <option value="none">normal</option>
    <option value="deutan">deuteranopia</option>
    <option value="protan">protanopia</option>
    <option value="tritan">tritanopia</option>
    <option value="mono">greyscale / print</option>
  </select>
</div>

<script>
// ---------------------------------------------------------------- fake data
const DAYS = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const ACTIVITIES = [
  { name:"Coding",        src:"proj-coding",  mult:2.5, effect:"positive", mins:[95,120,60,140,80,30,0] },
  { name:"Reading",       src:"proj-reading", mult:1.0, effect:"positive", mins:[30,20,45,0,25,60,50] },
  { name:"Exercise",      src:"proj-gym",     mult:3.0, effect:"positive", mins:[0,45,0,45,0,60,30] },
  // News is deliberately −1×: it puts the +1× / −1× pair on screen, which is the
  // worst measured pair in the emerald↔rose ramp (deutan ΔE 2.3). Without it the
  // prototype would never render the failure it is meant to expose.
  { name:"News",          src:"proj-news",    mult:1.0, effect:"negative", mins:[25,30,20,35,25,40,30] },
  { name:"YouTube",       src:"proj-youtube", mult:2.0, effect:"negative", mins:[40,25,70,15,55,90,65] },
  { name:"Doomscrolling", src:"proj-social",  mult:3.5, effect:"negative", mins:[15,10,35,5,20,45,40] },
];
const sign = a => a.effect === "positive" ? 1 : -1;
const pm   = (a,d) => a.mins[d] * a.mult * sign(a);
const fmt  = m => { const s = m<0?"−":""; const x=Math.round(Math.abs(m));
                    return x>=60 ? `${s}${Math.floor(x/60)}h ${String(x%60).padStart(2,"0")}m` : `${s}${x}m`; };
const signedMult = a => (a.effect==="positive"?"+":"−") + a.mult + "×";
const weekTotal = a => DAYS.reduce((s,_,d)=>s+pm(a,d),0);
const weekTracked = a => a.mins.reduce((s,x)=>s+x,0);

// the fixed ramp: |multiplier| -> step 1..4, clamped at 3
function step(mult){ const m=Math.abs(mult); if(m<=1) return 1; if(m<=2) return 2; if(m<3) return 3; return 4; }
const shade = a => `var(--${a.effect==="positive"?"e":"d"}${step(a.mult)})`;
const tint  = (a,deep) => `var(--${a.effect==="positive"?"e":"d"}-tint${deep?"-2":""})`;

// ---------------------------------------------------------------- variants
const VARIANTS = {
  A: { name:"A — Wash + stacked day",     chart:chartStacked,   cards:cardsWash,
       sub:"One stacked row per day: every Activity's Play Minutes side by side, drains included. Bar length is magnitude; the signed net sits on the right." },
  B: { name:"B — Rail + diverging",       chart:chartDiverging, cards:cardsRail,
       sub:"Earn above the zero line, drain below — the sign is carried by position, not hue. The rail on each card is the only deep colour outside the chart." },
  C: { name:"C — Chip + small multiples", chart:chartSmall,     cards:cardsChip,
       sub:"One track per Activity across the week; cell depth is that day's Play Minutes. Cards keep the existing purple/pink treatment untouched." },
};

function legend(){
  document.getElementById("legend").innerHTML = ACTIVITIES.map(a =>
    `<span class="item"><span class="swatch" style="background:${shade(a)}"></span>${a.name} <b style="font-variant-numeric:tabular-nums">${signedMult(a)}</b></span>`
  ).join("");
}

// --- A: one stacked bar per day
function chartStacked(){
  const per = DAYS.map((_,d)=>ACTIVITIES.map(a=>({a, v:pm(a,d)})));
  const max = Math.max(...per.map(r=>r.reduce((s,x)=>s+Math.abs(x.v),0)));
  return DAYS.map((day,d)=>{
    const row = per[d].filter(x=>x.v!==0).sort((x,y)=>y.v-x.v);
    const net = per[d].reduce((s,x)=>s+x.v,0);
    const used = row.reduce((s,x)=>s+Math.abs(x.v),0);
    const segs = row.map((x,i)=>`<div class="seg ${i===0?"first":""} ${i===row.length-1?"last":""}"
        style="background:${shade(x.a)};flex:${Math.abs(x.v)}" title="${x.a.name} ${fmt(x.v)}"></div>`).join("");
    const pad = max - used;
    return `<div class="stack-row"><span class="daylbl">${day}</span>
      <div class="stack">${segs}${pad>0?`<div style="flex:${pad}"></div>`:""}</div>
      <span class="total ${net<0?"neg":""}">${fmt(net)}</span></div>`;
  }).join("") + `<div class="stack-row"><span class="daylbl"></span><div class="stack"></div><span class="total axis-lbl">net</span></div>`;
}

// --- B: diverging columns, zero line in the middle
function chartDiverging(){
  const up = DAYS.map((_,d)=>ACTIVITIES.filter(a=>sign(a)>0).map(a=>({a,v:pm(a,d)})).filter(x=>x.v));
  const dn = DAYS.map((_,d)=>ACTIVITIES.filter(a=>sign(a)<0).map(a=>({a,v:-pm(a,d)})).filter(x=>x.v));
  const maxU = Math.max(...up.map(r=>r.reduce((s,x)=>s+x.v,0)));
  const maxD = Math.max(...dn.map(r=>r.reduce((s,x)=>s+x.v,0)));
  const scale = 150 / maxU;
  const cols = DAYS.map((day,d)=>{
    const u = up[d].map(x=>`<div class="dseg" style="background:${shade(x.a)};height:${(x.v*scale).toFixed(1)}px" title="${x.a.name} ${fmt(x.v)}"></div>`).join("");
    const l = dn[d].map(x=>`<div class="dseg" style="background:${shade(x.a)};height:${(x.v*scale).toFixed(1)}px" title="${x.a.name} −${fmt(x.v)}"></div>`).join("");
    return `<div class="dcol">
      <div class="dtop" style="height:150px">${u}</div>
      <div class="dbot" style="height:${(maxD*scale+4).toFixed(0)}px;margin-top:2px">${l}</div>
      <div class="cap">${day}</div></div>`;
  }).join("");
  return `<div style="display:flex;gap:.5rem;align-items:flex-start;position:relative">
      <div style="width:2.8rem;flex:none;position:relative;height:150px">
        <span class="axis-lbl" style="position:absolute;top:-4px">earn</span>
        <span class="axis-lbl" style="position:absolute;top:142px">0</span>
        <span class="axis-lbl" style="position:absolute;top:${(maxD*scale/2+150).toFixed(0)}px">drain</span>
      </div>
      ${cols}
      <div style="position:absolute;left:2.8rem;right:0;top:150px;border-top:1px solid var(--baseline)"></div>
    </div>`;
}

// --- C: one track per activity, seven cells
function chartSmall(){
  const maxAbs = Math.max(...ACTIVITIES.flatMap(a=>DAYS.map((_,d)=>Math.abs(pm(a,d)))));
  return ACTIVITIES.map(a=>{
    const cells = DAYS.map((_,d)=>{
      const v = Math.abs(pm(a,d)), o = v/maxAbs;
      return `<div class="sm-cell" title="${a.name} ${fmt(pm(a,d))}">${v?`<div class="sm-fill" style="background:${shade(a)};opacity:${(0.25+0.75*o).toFixed(2)}"></div>`:""}</div>`;
    }).join("");
    const wk = weekTotal(a);
    return `<div class="sm-row"><span class="sm-name">${a.name} <b>${signedMult(a)}</b></span>
      <div class="sm-track">${cells}</div><span class="total ${wk<0?"neg":""}">${fmt(wk)}</span></div>`;
  }).join("") + `<div class="sm-row"><span class="sm-name"></span>
      <div class="sm-track">${DAYS.map(d=>`<span class="axis-lbl" style="flex:1;text-align:center">${d[0]}</span>`).join("")}</div>
      <span class="total"></span></div>`;
}

// --- cards
function cardsWash(){
  return ACTIVITIES.map(a=>{
    const wk = weekTotal(a);
    return `<div class="act-wash" style="background:${tint(a, step(a.mult)>=3)};border-color:${shade(a)}33">
      <div><div class="act-name">${a.name}</div>
        <div class="act-meta">Multiplier <span class="mult" style="color:${shade(a)}">${signedMult(a)}</span> · Source <span style="font-family:ui-monospace,monospace">${a.src}</span></div>
        <div class="act-meta">This week ${fmt(weekTracked(a))} tracked</div></div>
      <div class="pm" style="margin-left:auto;color:${shade(a)}">${fmt(wk)}</div></div>`;
  }).join("");
}
function cardsRail(){
  return ACTIVITIES.map(a=>{
    const wk = weekTotal(a);
    return `<div class="rail" style="border-left-color:${shade(a)}">
      <div><div class="act-name">${a.name}</div>
        <div class="act-meta">Source <span style="font-family:ui-monospace,monospace">${a.src}</span> · ${fmt(weekTracked(a))} tracked</div></div>
      <div style="margin-left:auto;text-align:right">
        <span class="chip" style="background:${shade(a)}">${signedMult(a)}</span>
        <div class="pm">${fmt(wk)}</div></div></div>`;
  }).join("");
}
function cardsChip(){
  return ACTIVITIES.map(a=>{
    const wk = weekTotal(a);
    return `<div class="act-plain">
      <div><div class="act-name">${a.name}</div>
        <div class="act-meta">Source <span style="font-family:ui-monospace,monospace">${a.src}</span> · ${fmt(weekTracked(a))} tracked</div></div>
      <div style="margin-left:auto;text-align:right">
        <span class="chip ghost" style="color:${shade(a)}">${signedMult(a)}</span>
        <div class="pm" style="color:${a.effect==="negative"?shade(a):"var(--purple-600)"}">${fmt(wk)}</div></div></div>`;
  }).join("");
}

// --- token table + measured verdict
const TOKENS = {
  "teal-orange":{ e:["teal-500","teal-600","teal-700","teal-800"], eh:["#00bba7","#009689","#00786f","#005f5a"],
                  d:["orange-400","orange-600","orange-700","orange-800"], dh:["#ff8904","#f54900","#ca3500","#9f2d00"],
                  t:["teal-50","teal-100","orange-50","orange-100"], th:["#f0fdfa","#cbfbf1","#fff7ed","#ffedd4"],
                  worst:"11.0", ok:true },
  "emerald-rose":{ e:["emerald-500","emerald-600","emerald-700","emerald-800"], eh:["#00bc7d","#009966","#007a55","#006045"],
                  d:["rose-400","rose-500","rose-700","rose-800"], dh:["#ff637e","#ff2056","#c70036","#a50036"],
                  t:["emerald-50","emerald-100","rose-50","rose-100"], th:["#ecfdf5","#d0fae5","#fff1f2","#ffe4e6"],
                  worst:"2.3", ok:false },
  "teal-red":{ e:["teal-500","teal-600","teal-700","teal-800"], eh:["#00bba7","#009689","#00786f","#005f5a"],
                  d:["red-400","red-500","red-700","red-800"], dh:["#ff6467","#fb2c36","#c10007","#9f0712"],
                  t:["teal-50","teal-100","red-50","red-100"], th:["#f0fdfa","#cbfbf1","#fef2f2","#ffe2e2"],
                  worst:"10.0", ok:true },
};
const BANDS = ["|1×| and below","above |1×| to |2×|","above |2×|, below |3×|","|3×| and beyond (clamped)"];
function tokens(){
  const t = TOKENS[document.body.dataset.palette];
  const rows = BANDS.map((b,i)=>`<tr>
      <td>${b}</td>
      <td><span class="swatch" style="display:inline-block;vertical-align:-2px;background:${t.eh[i]}"></span></td>
      <td class="mono">${t.e[i]}</td><td class="mono">${t.eh[i]}</td>
      <td><span class="swatch" style="display:inline-block;vertical-align:-2px;background:${t.dh[i]}"></span></td>
      <td class="mono">${t.d[i]}</td><td class="mono">${t.dh[i]}</td></tr>`).join("");
  const tints = t.t.map((n,i)=>`<span style="display:inline-flex;align-items:center;gap:.4rem;margin-right:1rem">
      <span class="swatch" style="background:${t.th[i]}"></span><span class="mono">${n}</span></span>`).join("");
  document.getElementById("tokens").innerHTML =
    `<table><thead><tr><th>Band</th><th colspan="3">Earn (positive)</th><th colspan="3">Drain (negative)</th></tr></thead><tbody>${rows}</tbody></table>
     <div style="margin-top:.75rem;font-size:.74rem;color:var(--ink-2)">Card tints: ${tints}</div>`;
  document.getElementById("verdict").innerHTML = t.ok
    ? `<b>Measured — passes.</b> Worst same-rank earn-vs-drain CVD separation <b>ΔE ${t.worst}</b> (OKLab ×100, ≥8 target) across all four bands. Each arm also passes the ordinal-ramp checks on white: monotone lightness, every adjacent ΔL ≥ 0.06, light end clears 2:1 contrast.`
    : `<b>Measured — FAILS.</b> Worst same-rank earn-vs-drain CVD separation <b>ΔE ${t.worst}</b> (deutan) at the |1×| band — Reading <b>+1×</b> against News <b>−1×</b>: all but the same colour to a deuteranope. Bands 3 and 4 also sit in the 6–8 warn band.`;
  document.getElementById("verdict").innerHTML +=
    `<div style="margin-top:.5rem;padding-top:.5rem;border-top:1px solid #fde68a">
       <b>Trust the numbers, not the <i>vision</i> switch.</b> Those ΔE figures come from the dataviz
       validator (Brettel-style simulation in OKLab). The <i>vision</i> filter on this page is a cheap
       3×3 matrix approximation — good for a feel, and it does <i>not</i> faithfully reproduce the
       ΔE 2.3 pair. Where the two disagree, the validator wins.</div>`;
}

// ---------------------------------------------------------------- switcher
const keys = Object.keys(VARIANTS);
function current(){ const v = new URLSearchParams(location.search).get("variant"); return keys.includes(v) ? v : "A"; }
function render(){
  const v = VARIANTS[current()];
  document.getElementById("vname").textContent = v.name;
  document.getElementById("chartSub").textContent = v.sub;
  document.getElementById("cardSub").textContent = "Effect treatment: " + v.name.split("— ")[1];
  legend();
  document.getElementById("chart").innerHTML = v.chart();
  document.getElementById("cards").innerHTML = v.cards();
  tokens();
}
function go(delta){
  const i = keys.indexOf(current());
  const k = keys[(i + delta + keys.length) % keys.length];
  const u = new URL(location); u.searchParams.set("variant", k); history.replaceState({}, "", u); render();
}
document.getElementById("prev").onclick = () => go(-1);
document.getElementById("next").onclick = () => go(1);
addEventListener("keydown", e => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.key === "ArrowLeft") go(-1);
  if (e.key === "ArrowRight") go(1);
});
const palSel = document.getElementById("pal"), cvdSel = document.getElementById("cvd");
const qs = new URLSearchParams(location.search);
if (TOKENS[qs.get("palette")]) document.body.dataset.palette = qs.get("palette");
if (qs.get("cvd")) document.body.dataset.cvd = qs.get("cvd");
palSel.value = document.body.dataset.palette;
cvdSel.value = document.body.dataset.cvd;
palSel.onchange = e => { document.body.dataset.palette = e.target.value;
  const u = new URL(location); u.searchParams.set("palette", e.target.value); history.replaceState({}, "", u); render(); };
cvdSel.onchange = e => { document.body.dataset.cvd = e.target.value;
  const u = new URL(location); u.searchParams.set("cvd", e.target.value); history.replaceState({}, "", u); };
render();
</script>
